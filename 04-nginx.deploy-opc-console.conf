# Docker 镜像启动时注入 DEPLOY_OPC_API_HOST。
map $http_x_forwarded_proto $console_forwarded_proto {
    default $scheme;
    https https;
}

map $http_upgrade $console_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 256m;

    location ~ ^/(api|net-data-monitor|checkhealth)(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $deploy_api http://${DEPLOY_OPC_API_HOST}:3000;
        proxy_pass $deploy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $console_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $console_connection_upgrade;
        proxy_read_timeout 300s;
    }

    location ^~ /static/ {
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
